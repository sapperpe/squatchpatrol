{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Torchlight Adventures - SquatchPatrol</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --bg: #07110b;
      --panel: #0b1f13;
      --green: #7CFF9B;
      --green-dim: #3da95a;
      --amber: #ffd36a;
      --red: #ff6b6b;
      --border: #1d6b35;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(45, 120, 60, 0.22), transparent 35%),
        linear-gradient(180deg, #020402 0%, var(--bg) 100%);
      color: var(--green);
      font-family: Consolas, "Courier New", monospace;
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 24px;
    }

    .terminal-shell {
      width: min(1100px, 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(3, 12, 6, 0.96);
      box-shadow:
        0 0 40px rgba(124, 255, 155, 0.12),
        inset 0 0 45px rgba(124, 255, 155, 0.04);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, #09200f, #061209);
    }

    .brand {
      line-height: 1.2;
    }

    .brand-title {
      font-size: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #d7ffe0;
      font-weight: 700;
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--green-dim);
      text-transform: uppercase;
    }

    .status {
      color: var(--amber);
      font-size: 12px;
      white-space: nowrap;
    }

    .screen {
      padding: 24px;
      min-height: 70vh;
      position: relative;
    }

    .screen::before {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.025),
        rgba(255, 255, 255, 0.025) 1px,
        transparent 1px,
        transparent 4px
      );
      opacity: 0.4;
    }

    #output {
      position: relative;
      z-index: 1;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 16px;
      text-shadow: 0 0 8px rgba(124, 255, 155, 0.25);
      margin-bottom: 18px;
    }

    .command-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      border-top: 1px solid rgba(124, 255, 155, 0.22);
      padding-top: 18px;
    }

    .prompt {
      color: var(--amber);
      font-weight: 700;
      font-size: 18px;
    }

    #cmd {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #d7ffe0;
      font-family: inherit;
      font-size: 18px;
      caret-color: var(--amber);
    }

    .hint-row {
      position: relative;
      z-index: 1;
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--green-dim);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hint-row span {
      border: 1px solid rgba(124, 255, 155, 0.2);
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(124, 255, 155, 0.04);
    }

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .screen {
        padding: 16px;
      }

      #output,
      #cmd {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="terminal-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-title">Torchlight Adventures - SquatchPatrol</div>
        <div class="brand-subtitle">PNW Field Terminal</div>
      </div>
      <div class="status">STATUS: ONLINE</div>
    </header>

    <section class="screen" onclick="document.getElementById('cmd').focus()">
      <pre id="output">{{ banner }}</pre>

      <form id="cmd-form" class="command-row">
        {% csrf_token %}
        <span class="prompt">&gt;</span>
        <input id="cmd" name="cmd" autocomplete="off" autofocus>
      </form>

      <div class="hint-row">
        <span>HELP</span>
        <span>LOOK</span>
        <span>TAKE</span>
        <span>INVENTORY</span>
        <span>RESTART</span>
        <span>CLS</span>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("cmd-form");
    const input = document.getElementById("cmd");
    const output = document.getElementById("output");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const cmd = input.value.trim();
      if (!cmd) return;

      output.textContent += "\n\n> " + cmd;
      input.value = "";

      const formData = new FormData();
      formData.append("cmd", cmd);
      formData.append("csrfmiddlewaretoken", document.querySelector("[name=csrfmiddlewaretoken]").value);

      const response = await fetch("{% url 'game:command' %}", {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (data.out === "__CLS__") {
        output.textContent = "";
      } else {
        output.textContent += "\n" + data.out;
      }

      window.scrollTo(0, document.body.scrollHeight);
    });
  </script>
</body>
</html>
